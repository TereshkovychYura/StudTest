function parse(txt,hdr){

    else if(ch==='"')q=true;else if(ch===d){r.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&txt[i+1]==="\n")i++;r.push(c);rows.push(r);r=[];c=""}else c+=ch}
